<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>SillyTavern Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b0d10'/><path d='M26 68V32h12l12 20 12-20h12v36H62V49L52 66h-4L38 49v19z' fill='%23ffb020'/></svg>">
<style>
/* ─────────────────────────────────────────────────────────────
   SillyTavern Manager — control-room console
   Dark-first, hairline panels, monospace for anything technical.
   No webfonts: this app must work with no internet at all.
   ───────────────────────────────────────────────────────────── */

:root {
  --bg:        #0b0d10;
  --bg-deep:   #070809;
  --panel:     #14171c;
  --panel-2:   #1a1e25;
  --line:      #252a33;
  --line-soft: #1c212a;
  --ink:       #e8ebf0;
  --ink-dim:   #a4adbd;
  --muted:     #6f7887;

  --accent:    #ffb020;
  --accent-dim:#7a5510;
  --ok:        #3fb950;
  --warn:      #d29922;
  --bad:       #f85149;
  --info:      #58a6ff;

  --radius: 7px;
  --rail: 232px;

  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "SF Mono", "Menlo",
          "DejaVu Sans Mono", Consolas, monospace;
  --sans: ui-sans-serif, system-ui, "Segoe UI Variable Text", "Segoe UI",
          -apple-system, "Helvetica Neue", Arial, sans-serif;

  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.8);
}

html[data-theme="light"] {
  --bg:        #f4f5f7;
  --bg-deep:   #e9ebef;
  --panel:     #ffffff;
  --panel-2:   #f7f8fa;
  --line:      #dfe3ea;
  --line-soft: #eaedf2;
  --ink:       #14171c;
  --ink-dim:   #4a5261;
  --muted:     #79818f;
  --accent:    #b26a00;
  --accent-dim:#f0d9ab;
  --ok:        #1a7f37;
  --warn:      #9a6700;
  --bad:       #cf222e;
  --info:      #0969da;
  --shadow: 0 1px 2px rgba(16,22,32,.06), 0 8px 24px -16px rgba(16,22,32,.4);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-wrap: anywhere;
}

/* Faint grid, like a plotting surface. Sits behind everything. */
body::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 64px 64px;
  opacity: .5;
  mask-image: radial-gradient(120% 90% at 50% 0%, #000 20%, transparent 78%);
  z-index: 0;
}

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }

a { color: var(--info); text-decoration: none; }
a:hover { text-decoration: underline; }

code, kbd, .mono { font-family: var(--mono); }

.eyebrow {
  font: 600 10px/1 var(--mono);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ── shell ─────────────────────────────────────────────────── */

#app { position: relative; z-index: 1; min-height: 100%; }

.shell { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100vh; }

.rail {
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%);
  padding: 18px 12px;
  display: flex; flex-direction: column; gap: 6px;
  position: sticky; top: 0; height: 100vh;
}

.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  background: linear-gradient(145deg, var(--accent), #ff7a18);
  color: #12100a;
  display: grid; place-items: center;
  font: 800 15px/1 var(--mono);
  box-shadow: 0 0 0 1px rgba(255,176,32,.28), 0 6px 18px -8px rgba(255,140,0,.7);
}
.brand-text b { display: block; font-size: 13px; letter-spacing: -.01em; }
.brand-text span { font: 500 10px/1.3 var(--mono); color: var(--muted); letter-spacing: .06em; }

.navlink {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: var(--radius);
  color: var(--ink-dim); cursor: pointer; user-select: none;
  border: 1px solid transparent;
  font-size: 13.5px;
  transition: background .14s, color .14s, border-color .14s;
}
.navlink:hover { background: var(--panel-2); color: var(--ink); }
.navlink[aria-current="true"] {
  background: var(--panel-2); color: var(--ink);
  border-color: var(--line);
  box-shadow: inset 2px 0 0 var(--accent);
}
.navlink svg { width: 16px; height: 16px; flex: none; opacity: .85; }
.navlink .badge {
  margin-left: auto; font: 600 10px/1 var(--mono);
  padding: 3px 6px; border-radius: 20px;
  background: var(--bad); color: #fff;
}

.rail-foot { margin-top: auto; display: grid; gap: 8px; }

.main { min-width: 0; display: flex; flex-direction: column; }

/* ── annunciator: the signature element ────────────────────── */

.annunciator {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  gap: 1px; background: var(--line);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
  backdrop-filter: blur(8px);
}
.ann {
  background: var(--panel);
  padding: 9px 14px;
  display: flex; align-items: center; gap: 9px;
  min-width: 0;
}
.ann .lamp {
  width: 7px; height: 7px; border-radius: 50%; flex: none;
  background: var(--muted);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--muted) 18%, transparent);
}
.ann[data-state="ok"]   .lamp { background: var(--ok);   box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent), 0 0 10px var(--ok); }
.ann[data-state="warn"] .lamp { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); animation: breathe 2.4s ease-in-out infinite; }
.ann[data-state="bad"]  .lamp { background: var(--bad);  box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 20%, transparent); animation: breathe 1.1s ease-in-out infinite; }
@keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

.ann-text { min-width: 0; }
.ann-text b { display: block; font: 600 11px/1.2 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.ann-text span { display: block; font-size: 12.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── content ───────────────────────────────────────────────── */

.view { padding: 26px 28px 64px; max-width: 1180px; width: 100%; }
.view > * { animation: rise .42s cubic-bezier(.2,.7,.3,1) backwards; }
.view > *:nth-child(1) { animation-delay: .02s }
.view > *:nth-child(2) { animation-delay: .06s }
.view > *:nth-child(3) { animation-delay: .1s }
.view > *:nth-child(4) { animation-delay: .14s }
.view > *:nth-child(5) { animation-delay: .18s }
@keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) {
  .view > *, .ann .lamp { animation: none !important; }
}

.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 21px; }
.page-head p { margin: 4px 0 0; color: var(--ink-dim); font-size: 13.5px; max-width: 62ch; }
.page-head .spacer { flex: 1; }

.grid { display: grid; gap: 14px; }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.card > header {
  display: flex; align-items: center; gap: 10px;
  margin: -2px 0 12px;
}
.card > header h2 { font-size: 13px; letter-spacing: .02em; }
.card > header .spacer { flex: 1; }

.stat .label { font: 600 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.stat .value { font: 600 26px/1.1 var(--mono); margin-top: 8px; letter-spacing: -.02em; }
.stat .value.sm { font-size: 17px; }
.stat .sub { margin-top: 5px; font-size: 12px; color: var(--ink-dim); }

.kv { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 7px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; word-break: break-all; }

/* ── controls ──────────────────────────────────────────────── */

button, .btn {
  font: 600 13px/1 var(--sans);
  padding: 9px 14px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  transition: background .14s, border-color .14s, transform .06s;
}
button:hover:not(:disabled), .btn:hover { background: var(--panel); border-color: var(--muted); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary {
  background: var(--accent); border-color: var(--accent); color: #17120a;
  box-shadow: 0 6px 18px -10px var(--accent);
}
button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, #fff); }
button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
button.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }
button.ghost { background: transparent; }
button.sm { padding: 6px 10px; font-size: 12px; }

input, select, textarea {
  font: 13px/1.4 var(--sans);
  padding: 9px 11px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--bg-deep);
  color: var(--ink);
  width: 100%;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
}
textarea { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; resize: vertical; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: right 14px center, right 9px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px; }

label.field { display: block; margin-bottom: 14px; }
label.field > span.name { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; }
label.field > span.help { display: block; font-size: 12px; color: var(--muted); margin-top: 5px; }

.switch { display: flex; align-items: flex-start; gap: 11px; cursor: pointer; padding: 9px 0; }
.switch input { display: none; }
.switch .track {
  width: 36px; height: 20px; border-radius: 20px; flex: none; margin-top: 1px;
  background: var(--line); position: relative; transition: background .18s;
  border: 1px solid var(--line);
}
.switch .track::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--muted); transition: transform .18s, background .18s;
}
.switch input:checked + .track { background: color-mix(in srgb, var(--accent) 30%, var(--line)); border-color: var(--accent); }
.switch input:checked + .track::after { transform: translateX(16px); background: var(--accent); }
.switch .txt b { display: block; font-size: 13px; font-weight: 600; }
.switch .txt span { display: block; font-size: 12px; color: var(--muted); }

/* ── table ─────────────────────────────────────────────────── */

.table-wrap { overflow-x: auto; margin: 0 -16px -16px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 9px 16px; border-top: 1px solid var(--line-soft); white-space: nowrap; }
th { font: 600 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-top: 0; padding-bottom: 8px; }
tbody tr:hover { background: var(--panel-2); }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.actions { text-align: right; }
td.actions button { margin-left: 5px; }

/* ── pills, chips, notices ─────────────────────────────────── */

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font: 600 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  padding: 4px 8px; border-radius: 20px;
  border: 1px solid var(--line); color: var(--ink-dim);
}
.pill.ok   { color: var(--ok);   border-color: color-mix(in srgb, var(--ok) 40%, transparent);   background: color-mix(in srgb, var(--ok) 10%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.pill.bad  { color: var(--bad);  border-color: color-mix(in srgb, var(--bad) 40%, transparent);  background: color-mix(in srgb, var(--bad) 10%, transparent); }
.pill.info { color: var(--info); border-color: color-mix(in srgb, var(--info) 40%, transparent); background: color-mix(in srgb, var(--info) 10%, transparent); }

.notice {
  border: 1px solid var(--line); border-left-width: 3px;
  border-radius: var(--radius);
  padding: 12px 14px; font-size: 13px; color: var(--ink-dim);
  background: var(--panel);
}
.notice b { color: var(--ink); }
.notice.warn { border-left-color: var(--warn); }
.notice.bad  { border-left-color: var(--bad); }
.notice.ok   { border-left-color: var(--ok); }
.notice.info { border-left-color: var(--info); }

/* ── progress ──────────────────────────────────────────────── */

.bar { height: 6px; border-radius: 6px; background: var(--bg-deep); overflow: hidden; border: 1px solid var(--line); }
.bar > i {
  display: block; height: 100%; background: var(--accent);
  background-image: linear-gradient(115deg, transparent 25%, rgba(255,255,255,.28) 25%, rgba(255,255,255,.28) 50%, transparent 50%, transparent 75%, rgba(255,255,255,.28) 75%);
  background-size: 14px 14px;
  animation: crawl .7s linear infinite;
  transition: width .3s ease;
}
@keyframes crawl { to { background-position: 14px 0 } }

/* ── logs ──────────────────────────────────────────────────── */

.logbox {
  background: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font: 12px/1.65 var(--mono);
  padding: 10px 0;
  height: min(62vh, 620px);
  overflow: auto;
  scrollbar-width: thin;
}
.logline { display: grid; grid-template-columns: 62px 92px 1fr; gap: 10px; padding: 1px 14px; }
.logline:hover { background: var(--panel); }
.logline .t { color: var(--muted); }
.logline .s { color: var(--info); opacity: .85; }
.logline .m { white-space: pre-wrap; word-break: break-word; }
.logline[data-level="warn"]  .m { color: var(--warn); }
.logline[data-level="error"] .m { color: var(--bad); }
.logline mark { background: color-mix(in srgb, var(--accent) 35%, transparent); color: inherit; border-radius: 2px; }

/* ── charts ────────────────────────────────────────────────── */

.chart { width: 100%; height: 190px; display: block; overflow: visible; }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .gridline { stroke: var(--line-soft); stroke-width: 1; }
.chart .area { fill: url(#gAccent); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--accent); }
.chart text { fill: var(--muted); font: 10px var(--mono); }
.chart .bar { fill: var(--info); }
.chart .bar:hover { fill: var(--accent); }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-dim); }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 5px; }

/* ── modal ─────────────────────────────────────────────────── */

.scrim {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(4,6,9,.72);
  backdrop-filter: blur(3px);
  display: grid; place-items: center; padding: 20px;
  animation: fade .18s ease;
}
@keyframes fade { from { opacity: 0 } }
.modal {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 20px; width: min(560px, 100%);
  max-height: 88vh; overflow: auto;
  box-shadow: 0 30px 70px -30px rgba(0,0,0,.9);
  animation: pop .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.985) } }
.modal h2 { font-size: 16px; margin-bottom: 6px; }
.modal .row { display: flex; gap: 9px; justify-content: flex-end; margin-top: 18px; }

/* ── gate (terms / login / setup) ──────────────────────────── */

.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.gate-card {
  width: min(520px, 100%);
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 26px;
  box-shadow: 0 40px 90px -50px #000;
}
.gate-card .brand { padding-bottom: 20px; }
.gate ul { margin: 12px 0 0; padding-left: 18px; color: var(--ink-dim); font-size: 13px; }
.gate li { margin: 6px 0; }

/* ── toast ─────────────────────────────────────────────────── */

#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 90; display: grid; gap: 8px; max-width: min(400px, calc(100vw - 32px)); }
.toast {
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: var(--radius); padding: 11px 13px; font-size: 13px;
  box-shadow: 0 20px 40px -22px #000;
  animation: slide .24s cubic-bezier(.2,.8,.3,1);
}
.toast.bad { border-left-color: var(--bad); }
.toast.ok  { border-left-color: var(--ok); }
@keyframes slide { from { opacity: 0; transform: translateX(14px) } }

/* ── responsive: phone-first controls ──────────────────────── */

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail {
    position: fixed; bottom: 0; left: 0; right: 0; top: auto;
    height: auto; flex-direction: row; overflow-x: auto;
    border-right: 0; border-top: 1px solid var(--line);
    padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
    z-index: 40; gap: 2px;
    background: var(--panel);
  }
  .brand, .rail-foot { display: none; }
  .navlink { flex-direction: column; gap: 3px; font-size: 10.5px; padding: 7px 11px; white-space: nowrap; }
  .navlink[aria-current="true"] { box-shadow: inset 0 2px 0 var(--accent); }
  .view { padding: 18px 15px 96px; }
  .annunciator { grid-auto-flow: row; grid-auto-columns: auto; }
  .ann { padding: 8px 15px; }
  .table-wrap { margin: 0 -16px; }
  .logline { grid-template-columns: 54px 1fr; }
  .logline .s { display: none; }
}
</style>
</head>
<body>
<div id="app"><div class="gate"><div class="gate-card"><span class="eyebrow">Loading</span></div></div></div>
<div id="toasts"></div>
<script src="/manager/app.js?v=__STM_VERSION__"></script>
</body>
</html>
